name: 🐛 Bug report
description: Something in Golem is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** paste secrets, tokens or private endpoints.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to MCP Testing
        2. Import this manifest...
        3. Click Run scan
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP scanning / reports
        - Sandboxes / policies
        - Monitoring / SSE
        - Auth / login
        - Setup / Docker Compose
        - Other
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running Golem?
      options:
        - Docker Compose (npm run dev)
        - Frontend + backend separately
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node.js version, Docker version, browser"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Backend logs, browser console errors or screenshots. Remove any secrets first.
      render: shell
